name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Full history: the version gate diffs this branch against its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lexicon's parser is stricter than Node's. A plugin that violates these
      # rules fails to load in the app, so this gate comes first.
      - name: Sandbox lint
        run: npm run lint

      - name: Validate plugin manifests
        run: npm run validate

      - name: Check permissions match code
        run: npm run check:permissions

      # An edited plugin that keeps its old version installs nowhere: every
      # existing copy compares versions and concludes it is current.
      - name: Check plugin versions were bumped
        run: npm run check:versions -- --strict
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}

      - name: Test
        run: npm test

      - name: Build plugin ZIPs and the registry index
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: |
            dist/*.zip
            dist/index.json
