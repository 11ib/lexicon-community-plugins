name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run verify

      # Pin every zipUrl in index.json to this tag, so the sha256 recorded
      # beside it always describes the bytes that URL serves. A manual run has
      # no tag, so the script falls back to releases/latest/download.
      - name: Build plugin ZIPs and the registry index
        run: npm run build
        env:
          ZIP_BASE_URL: ${{ github.ref_type == 'tag' && format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) || '' }}

      # Each plugin ships as its own ZIP with config.json at the archive root,
      # which is what Lexicon expects in Documents/Lexicon/Plugins.
      #
      # index.json rides along as an asset: @lexicon-community/install reads it
      # from releases/latest/download/index.json, so publishing a release is
      # what makes a plugin installable.
      - name: Attach plugin ZIPs and index.json to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/index.json
          generate_release_notes: true
